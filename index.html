<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>todo-ultime</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1><img src="logo.svg" alt="" width="40" height="40"> todo-ultime
    <button id="theme" type="button" class="icon" aria-label="Mode sombre" aria-pressed="false">☾</button></h1>
  <form id="form">
    <label for="task" class="sr">Nouvelle tâche</label>
    <input id="task" placeholder="Une tâche à faire" autocomplete="off">
    <button>Ajouter</button>
  </form>
  <div class="filters" id="filters">
    <button type="button" data-filter="all">Toutes</button>
    <button type="button" data-filter="todo">À faire</button>
    <button type="button" data-filter="done">Faites</button>
  </div>
  <ul id="list"></ul>
  <p id="count" aria-live="polite"></p>
  <button type="button" id="clear" class="link">Supprimer les faites</button>
  <script src="app.js"></script>
</body>
</html>
